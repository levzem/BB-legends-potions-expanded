# Edit these definitions, then run `just icons` or `just icon redback`.
version = 1
output = "../.."                       # mod root; --output overrides this
check_mod_coverage = true

[template]
file = "potion-template.aseprite"
liquid_layer = "Liquid"

# Emblem coordinates are in the 70 x 70 bottle canvas.
# position = center [x,y]; +x right, +y down. Negative rotation tilts right; positive tilts left.
# scale = multiplier AFTER fitting into box, retaining the source aspect ratio.
# flip_x = true mirrors left/right across the head's vertical Y axis, before rotation.
[emblem]
box = [30, 29]
position = [28, 47]
scale = 1.0
rotation = -22.0
flip_x = false
saturation = 0.85
brightness = 0.90
opacity = 1.0
alpha_gain = 1.0

# Render the same finished bottle inside the 56 x 56 mutation badge.
# The oversized bottle sits behind the native foreground rim, like status_effect_134.
[effect]
size = [50, 50]
position = [5, 0]
marker_layer = "Bottle"
marker_mask = "skill-layers/effect_marker_mask.png"
edge_patch = "skill-layers/effect_edge_patch.png"
rim = "skill-layers/effect_rim.png"
interior_mask = "skill-layers/effect_interior_mask.png"

# Family background PNGs are shared independently of each creature's liquid color.

[families.orcs]
background = "skill-layers/backgrounds/orcs.png"

[families.goblins]
background = "skill-layers/backgrounds/goblins.png"

